<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>A11y Header Component - CSS3 Style Based</title>
    <meta
      name="description"
      content="All styles and layouts of header component in each webpage"
    />
    <meta name="keywords" content="HTML5 |  CSS3" />
    <meta name="author" content="Muhammed Soliman" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://maindomainname.com" />
    <!-- Meta Open Graph property="og:" for all social website facebook, linkedin, instagram etc... -->
    <meta
      property="og:title"
      content="A11y Header Component - CSS3 Style Based"
    />
    <meta
      property="og:description"
      content="All styles and layouts of header component in each webpage"
    />
    <meta property="og:type" content="webpage" />
    <meta property="og:image" content="https://maindomainname.com/header.png" />
    <meta property="og:website" content="https://maindomainname.com" />
    <meta property="og:site_name" content="Brand Name" />
    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="A11y Header Component - CSS3 Style Based"
    />
    <meta
      name="twitter:description"
      content="All styles and layouts of header component in each webpage"
    />
    <meta name="twitter:website" content="https://maindomainname.com" />
    <meta
      name="twitter:image"
      content="https://maindomainname.com/header.png"
    />
    <meta name="twitter:site" content="@brand_handle" />
    <!-- Favicons link -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="16x16" />
    <link rel="apple-touch-icon" href="/favicon.png" sizes="32x32" />
    <!-- Google Fonts and dns-prefetch api -->
    <link rel="dns-prefetch" href="https://api.domainname.com" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://gstatic.googleapis.com" crossorigin />
    <link
      rel="stylesheet"
      href="fonts.googleapis.com/css2?family=inter&display=swap"
    />
    <!-- link manifest for pwa progressive work application -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- External Style -->
    <link rel="stylesheet" href="header.css" />
    <!-- Internal Style -->
    <style></style>
    <!-- Script application/json+ld not need in this example as json linkeddata -->
    <script type="application/json+ld">
      {
          "@context": "https://schema.org",
          "@type": "Product",
          "productName": "Iphone 12",
          "productCountry": "USA"
      }
    </script>
    <!-- Script with defer not async -->
    <script src="/js/bundle.js" defer></script>
  </head>
  <body>
    <header class="header">
      <div class="container flex">
        <div class="header__logo">
          <a href="/" class="header__link">
            <img src="/logo.png" alt="" class="header__image" />
            <span class="header__company-name">Company Name</span>
          </a>
        </div>
        <nav class="header__nav" aria-label="Main Navigation">
          <ul class="header__list flex">
            <li class="header__list-item">
              <a class="header__link" href="/">Home</a>
            </li>
            <li class="header__list-item">
              <a class="header__link" href="#about">About</a>
            </li>
            <li class="header__list-item">
              <a class="header__link" href="#products">Products</a>
            </li>
            <li class="header__list-item">
              <a class="header__link" href="#contacts">Contacts</a>
            </li>
          </ul>
        </nav>
        <form action="/submit" method="POST" role="search" novalidate>
          <label for="search" class="sr-only">Search Term: </label>
          <input
            type="search"
            id="search"
            name="search"
            placeholder="Type a keyword search..."
            autocomplete="off"
          />
          <button type="submit" aria-label="Search Submit Button">
            <svg
              width="16"
              height="16"
              viewBox="0 0 16 16"
              aria-hidden="true"
              focusable="false"
            >
              <path fill="currentColor" d="" />
            </svg>
          </button>
        </form>
      </div>
    </header>
  </body>
</html>
